{title:'Փոշու ամպերը',icon:'◉',collect:'օդի չափիչ',bg:['#aeb4bd','#e9d7bb'],ground:'#8c8575',rock:'#77716d',story:'Լանջին ուժեղ քամի է։ Հասի՛ր չափման կայան՝ հավաքելով 5 օդի չափիչ։ Այս գլխում հարթակներն ավելի արագ են շարժվում, իսկ քամին քեզ շեղում է։',question:'Ի՞նչ տվյալներ են անհրաժեշտ հանքի փոշու ազդեցությունը գնահատելու համար։',options:['Միայն փոշու տեսանելի գույնը','Միայն մեկ լուսանկար','Չափումներ, եղանակային տվյալներ և տարածման գնահատում'],answer:2,fact:'Փոշու ազդեցությունը գնահատելիս կարևոր են մասնիկների չափումները, եղանակային պայմանները, տարածման մոդելավորումը և բնակավայրերի ու էկոհամակարգերի հնարավոր ազդեցությունը։'},

function menu(){show(`<div class="eyebrow">ԼԵՌՆԱՅԻՆ ԱՐԿԱԾ · 2D</div><h1>Վերադարձրու<br>Ամուլսարը ⛰️</h1><p>Թռիր հարթակից հարթակ, հավաքիր գիտական հետքերը, բացահայտիր լեռան պատմությունը։ Յուրաքանչյուր գլուխ նոր փորձություն է։</p><div class="tag">4 գլուխ</div><div class="tag">6 կերպար</div><div class="tag">ուժեղացումներ</div><div class="tag">պահպանվող առաջընթաց</div><button class="btn" id="start">▶ ՍԿՍԵԼ ԱՐԿԱԾԸ</button><button class="btn alt" id="map">🗺 ԳԼՈՒԽՆԵՐԸ</button><button class="btn alt" id="skins">🎒 ԿԵՐՊԱՐՆԵՐԸ</button><p class="mini">Կառավարում՝ ◀ ▶ կամ էկրանի ձախ/աջ կեսերը։ Կերպարն ինքնաբերաբար ցատկում է։</p>`);paper.querySelector('#start').onclick=()=>startChapter(Math.min(save.unlocked,3));paper.querySelector('#map').onclick=map;paper.querySelector('#skins').onclick=skinMenu}

function startChapter(n){level=n;score=0;hearts=3;collected=0;altitude=0;camera=0;frame=0;boost=0;shield=0;quizTries=0;checkpoint=0;started=false;world=[];objects=[];effects=[];player={x:180,y:635,vx:0,vy:-12,w:28,h:39};const rnd=(v)=>{let t=Math.sin(v*127.1+n*72.8)*43758.5453;return t-Math.floor(t)};

world.push({x:85,y:-2730,w:220,type:'finish',move:0,phase:0});goal=3420;updateHud();intro()}
function updateHud(){counts.textContent=`${chapters[level].icon} ${collected}/5 · ${'❤'.repeat(hearts)}${'♡'.repeat(3-hearts)}`;label.textContent=`${level+1}/4 · ${chapters[level].title}`;bar.style.width=`${Math.min(100,Math.max(0,altitude/goal*100))}%`}
function die(){if(shield>0){shield=0;toast('🛡 Վահանը պաշտպանեց');player.vy=-13;return}hearts--;effects.push({x:player.x+14,y:player.y+20,life:35,text:'💥'});if(hearts<=0){show(`<div class="eyebrow">ՓՈՐՁՈՒԹՅՈՒՆԸ ՇԱՐՈՒՆԱԿՎՈՒՄ Է</div><h2>Մի՛ հանձնվիր 🥾</h2><p>Հասել էիր ${Math.floor(altitude)} մետր բարձրության և հավաքել ${collected}/5 ${chapters[level].collect}։</p><button class="btn" id="retry">↻ ՆՈՐԻՑ ՓՈՐՁԵԼ</button><button class="btn alt" id="menu">ԳԼԽԱՎՈՐ</button>`);paper.querySelector('#retry').onclick=()=>startChapter(level);paper.querySelector('#menu').onclick=menu;return}const safe=world.filter(p=>!p.broken&&p.y>camera+210&&p.y<camera+610).sort((a,b)=>Math.abs(a.y-(camera+420))-Math.abs(b.y-(camera+420)))[0];player.x=safe?safe.x+safe.w/2-14:180;player.y=safe?safe.y-75:camera+320;player.vy=-14;player.vx=0;shield=110;toast('❤ Մնաց '+hearts+' կյանք')}
function quiz(){const ch=chapters[level];show(`<div class="eyebrow">ՀԵՏԱԶՈՏԱԿԱՆ ԿԱՅԱՆ · ${level+1}/4</div><h2>${ch.title}</h2><p>${ch.question}</p><div class="choices">${ch.options.map((o,i)=>`<button data-a="${i}">${o}</button>`).join('')}</div><div id="feedback" class="mini"></div><button class="btn" id="next" style="display:none">ՇԱՐՈՒՆԱԿԵԼ →</button>`);paper.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const v=+b.dataset.a;paper.querySelectorAll('[data-a]').forEach((x,i)=>{x.disabled=true;x.classList.toggle('correct',i===ch.answer);x.classList.toggle('wrong',i===v&&i!==ch.answer)});paper.querySelector('#feedback').textContent=(v===ch.answer?'Ճիշտ է։ ':'Ճիշտ պատասխանը նշված է։ ')+ch.fact;paper.querySelector('#next').style.display='block';if(v===ch.answer)score+=250});paper.querySelector('#next').onclick=()=>{save.unlocked=Math.max(save.unlocked,level+1);save.best=Math.max(save.best,score);persist();if(level===3)win();else{show(`<div class="eyebrow">ԳԼՈՒԽՆ ԱՎԱՐՏՎԱԾ Է</div><h2>${ch.icon} ${ch.title}</h2><p>Հավաքեցիր բոլոր հետքերը և բացահայտեցիր այս գլխի հարցը։ Հաջորդը՝ <b>${chapters[level+1].title}</b>։</p><button class="btn" id="nextChapter">ՀԱՋՈՐԴ ԳԼՈՒԽԸ →</button><button class="btn alt" id="map">ՔԱՐՏԵԶ</button>`);paper.querySelector('#nextChapter').onclick=()=>startChapter(level+1);paper.querySelector('#map').onclick=map}}}
function win(){show(`<div class="eyebrow">ԱՐԿԱԾԻ ԱՎԱՐՏԸ · 4/4</div><h1>Ամուլսարն ազատ է ⛰️</h1><p>Դու բարձրացար լեռը, հավաքեցիր ջրի նմուշները, ուսումնասիրեցիր ցիանիդի կիրառությունը, փոշու ազդեցությունը և բնության արժեքը։</p><h2>🏆 ${score} միավոր</h2><p class="mini">Սա խորհրդանշական խաղային ավարտ է, ոչ թե իրական հանքի կասեցման կամ վնասների վերացման պատկերում։ Իրական որոշումները պահանջում են գիտություն, իրավական ընթացակարգեր և հանրային մասնակցություն։</p><button class="btn" id="share">↗ ԿԻՍՎԵԼ ԱՐԴՅՈՒՆՔՈՎ</button><button class="btn alt" id="again">↻ ԽԱՂԱԼ ԿՐԿԻՆ</button>`);paper.querySelector('#again').onclick=menu;paper.querySelector('#share').onclick=async()=>{const s=`Ես ավարտեցի «Վերադարձրու Ամուլսարը» խաղը՝ ${score} միավորով ⛰️`;try{if(navigator.share)await navigator.share({title:'Վերադարձրու Ամուլսարը',text:s,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(s+' '+location.href);toast('Պատճենված է')}else alert(s)}catch(e){}}}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill()}
function update(dt){if(mode!=='play')return;frame+=dt;const ch=chapters[level],step=Math.min(2,dt);let dir=(keys.right?1:0)-(keys.left?1:0);if(level===2)dir+=Math.sin(frame*.012)*.22;player.vx+=(dir*5-player.vx)*.16*step;player.x+=player.vx*step;if(player.x>SW+15)player.x=-25;if(player.x<-30)player.x=SW+10;const oldBottom=player.y+player.h;player.vy+=.38*step;player.vy=Math.min(player.vy,12);player.y+=player.vy*step;for(const p of world){if(p.broken>0){p.broken+=step;continue}const x=p.x+(p.move?Math.sin(frame*.026+p.phase)*p.move:0);if(player.vy>=0&&oldBottom<=p.y+10&&player.y+player.h>=p.y&&player.x+player.w>x+7&&player.x<x+p.w-7){player.y=p.y-player.h;player.vy=p.type==='spring'?-21:boost>0?-18:-13.5;if(p.type==='spring')toast('🚀 Թռիչքային հարթակ');if(p.type==='crumble')p.broken=1;effects.push({x:player.x+14,y:p.y,life:18,text:'✧'})}}
if(boost>0)boost-=step;if(shield>0)shield-=step;for(const o of objects){if(o.got)continue;const ox=o.x+(o.kind==='hazard'?Math.sin(frame*.025+o.phase)*20:0);if(Math.abs(player.x+14-ox)<28&&Math.abs(player.y+18-o.y)<32){if(o.kind==='hazard'){o.got=true;die();if(mode!=='play')return}else if(o.kind==='collect'){o.got=true;collected++;score+=100;toast(`${ch.icon} ${collected}/5 · ${ch.collect}`)}else if(o.kind==='heart'){o.got=true;hearts=Math.min(3,hearts+1);toast('❤ Լրացուցիչ կյանք')}else if(o.kind==='boost'){o.got=true;boost=260;shield=120;player.vy=-19;toast('🚀 Արագ վերելք + պաշտպանություն')}}}
if(player.y-camera<SH*.38)camera+=(player.y-camera-SH*.38)*.15*step;altitude=Math.max(altitude,Math.round(690-player.y));if(player.y-camera>SH+100){die();if(mode!=='play')return}if(player.y<-2680){if(collected>=5){mode='transition';quiz()}else{player.vy=5;toast(`Գագաթին հասնելուց առաջ հավաքիր ևս ${5-collected} ${ch.collect}`)}}effects=effects.filter(e=>e.life>0);effects.forEach(e=>{e.life-=step;e.y-=.6*step});updateHud()}
function mountainLayer(y,color,par,amp){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,SH);for(let x=0;x<=SW+15;x+=12){const z=x+camera*par;ctx.lineTo(x,y+Math.sin(z*.014+par*7)*amp+Math.sin(z*.035)*amp*.3)}ctx.lineTo(SW,SH);ctx.closePath();ctx.fill()}
function draw(){const ch=chapters[level],g=ctx.createLinearGradient(0,0,0,SH);g.addColorStop(0,ch.bg[0]);g.addColorStop(1,ch.bg[1]);ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH);
ctx.fillStyle='#fff5ce';ctx.beginPath();ctx.arc(320,140,37,0,Math.PI*2);ctx.fill();for(let i=0;i<9;i++){const x=(i*77+frame*.1)%520-80,y=80+(i%4)*130;ctx.fillStyle='#ffffff75';ctx.beginPath();ctx.ellipse(x,y,40,13,0,0,Math.PI*2);ctx.fill()}
mountainLayer(450,'#a0bdad',.07,50);mountainLayer(550,'#829c90',.15,58);mountainLayer(655,'#6c8a7d',.23,39);
ctx.save();ctx.translate(0,-camera);
for(const p of world){if(p.broken>22)continue;const x=p.x+(p.move?Math.sin(frame*.026+p.phase)*p.move:0),y=p.y;if(y-camera<-70||y-camera>SH+90)continue;ctx.fillStyle='#223e42';round(x-2,y+3,p.w+4,19,9,'#263e42');round(x,y,p.w,15,7,ch.rock);round(x-1,y-6,p.w+2,11,6,p.type==='crumble'?'#c4a173':p.type==='spring'?'#f0c36e':p.type==='finish'?'#f3dfad':ch.ground);ctx.fillStyle='#f4e7b7';for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(x+14+k*(p.w-24)/3,y-3,2,0,Math.PI*2);ctx.fill()}if(p.type==='moving'){ctx.fillStyle='#f2ddaa';ctx.font='17px system-ui';ctx.fillText('↔',x+p.w/2-9,y-12)}if(p.type==='spring'){ctx.font='23px system-ui';ctx.fillText('↟',x+p.w/2-10,y-9)}if(p.type==='finish'){ctx.font='27px system-ui';ctx.fillText('🚩',x+p.w/2-10,y-15)}if(p.type==='crumble'){ctx.strokeStyle='#634c43';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+22,y-5);ctx.lineTo(x+33,y+3);ctx.lineTo(x+44,y-5);ctx.stroke()}}
for(const o of objects){if(o.got||o.y-camera<-60||o.y-camera>SH+60)continue;const y=o.y+Math.sin(frame*.045+o.x)*5,x=o.x+(o.kind==='hazard'?Math.sin(frame*.025+o.phase)*20:0);ctx.save();ctx.translate(x,y);ctx.shadowColor='#fff3b0';ctx.shadowBlur=9;if(o.kind==='collect'){if(level===0){ctx.fillStyle='#3fafd3';ctx.beginPath();ctx.moveTo(0,-17);ctx.bezierCurveTo(-18,0,-11,15,0,15);ctx.bezierCurveTo(12,15,17,1,0,-17);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke()}else{ctx.font='30px system-ui';ctx.textAlign='center';ctx.fillText(['','📜','◉','🌼'][level],0,10)}}else{ctx.font='29px system-ui';ctx.textAlign='center';ctx.fillText(o.kind==='heart'?'❤️':o.kind==='boost'?'🚀':'⚠️',0,10)}ctx.restore()}
for(let i=0;i<14;i++){const x=(i*137)%SW,y=690-i*250;ctx.fillStyle=level===3?'#e4b14f':'#55775c';ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}
// Character: large outlined illustrated avatar, deliberately drawn on canvas rather than external assets.
const x=player.x,y=player.y;if(shield<=0||Math.floor(frame/5)%2===0){ctx.save();ctx.translate(x+14,y+20);ctx.rotate(Math.max(-.18,Math.min(.18,player.vx*.025)));ctx.lineWidth=3;ctx.strokeStyle='#233e43';ctx.fillStyle='#334d55';round(-14,-2,28,29,9,'#ba6b49');ctx.strokeRect(-10,18,7,11);ctx.strokeRect(4,18,7,11);round(player.vx>=0?-19:11,0,9,23,4,'#456a5d');ctx.fillStyle='#f1bf96';ctx.beginPath();ctx.arc(0,-13,13,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=['#5a433a','#47647b','#ba7648','#9b433d','#79553f','#485e62'][skin];ctx.beginPath();ctx.arc(0,-17,14,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#29383a';ctx.beginPath();ctx.arc(player.vx>=0?5:-5,-13,1.8,0,Math.PI*2);ctx.fill();if(skin===1){round(-15,-26,30,7,3,'#3c81a5')}if(skin===2||skin===4){ctx.font='17px system-ui';ctx.textAlign='center';ctx.fillText(skin===2?'🦊':'🐻',0,-12)}if(skin===5){ctx.font='17px system-ui';ctx.textAlign='center';ctx.fillText('🦉',0,-12)}if(skin===3){ctx.fillStyle='#c9473b';ctx.fillRect(9,-2,16,5)}ctx.restore()}
for(const e of effects){ctx.globalAlpha=e.life/35;ctx.font='23px system-ui';ctx.fillText(e.text,e.x,e.y)}ctx.globalAlpha=1;ctx.restore();
// Bottom instruction, visible in all mobile aspect ratios
if(mode==='play'&&frame<200){round(63,SH-152,264,30,12,'#193c49b5');ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff8df';ctx.fillText('◀  Շարժվիր  ·  Ցատկը ավտոմատ է  ▶',195,SH-132);ctx.textAlign='left'}}
function render(t){const dt=Math.min(2.1,(t-now)/16.667||1);now=t;ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);update(dt);draw();ctx.restore();requestAnimationFrame(render)}
function press(d,on){keys[d<0?'left':'right']=on}document.querySelectorAll('[data-dir]').forEach(b=>{const d=+b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(d,true);b.classList.add('active')});const end=e=>{e.preventDefault();press(d,false);b.classList.remove('active')};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end)});c.addEventListener('pointerdown',e=>{if(mode==='play')press(e.clientX<innerWidth/2?-1:1,true)});c.addEventListener('pointerup',()=>{keys.left=keys.right=false});c.addEventListener('pointercancel',()=>{keys.left=keys.right=false});addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});addEventListener('blur',()=>{keys.left=keys.right=false;if(mode==='play')pause()});function pause(){show(`<div class="eyebrow">ԴԱԴԱՐ</div><h2>Մի փոքր հանգիստ 🏕️</h2><p>Գլուխ ${level+1} · ${chapters[level].title}<br>Հավաքած՝ ${collected}/5</p><button class="btn" id="resume">▶ ՇԱՐՈՒՆԱԿԵԼ</button><button class="btn alt" id="restart">↻ ՍԿՍԵԼ ԳԼՈՒԽԸ ՆՈՐԻՑ</button><button class="btn alt" id="menu">ԳԼԽԱՎՈՐ</button>`);paper.querySelector('#resume').onclick=hide;paper.querySelector('#restart').onclick=()=>startChapter(level);paper.querySelector('#menu').onclick=menu}document.querySelector('#pause').onclick=()=>{if(mode==='play')pause()};
menu();requestAnimationFrame(render);
})();
</script></body></html>
