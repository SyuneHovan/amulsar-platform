<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet"><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#dbe6de}#status{position:absolute;bottom:18px;left:12px;z-index:4;max-width:320px;padding:8px 12px;border-radius:9px;background:#fffE;color:#304b3c;font:12px/1.4 system-ui;box-shadow:0 2px 12px #0002}#error{display:none;position:absolute;top:15px;left:15px;right:15px;background:#fff;padding:12px;border-radius:9px;color:#56362f;font:13px system-ui}</style></head><body><div id="map" role="application" aria-label="Ամուլսարի եռաչափ քարտեզ"></div><div id="status">3D ռելիեֆ · քաշելով պտտիր, Ctrl + քաշելով թեքիր</div><div id="error"></div><script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script>const error=document.getElementById('error');try{if(!window.maplibregl||typeof maplibregl.Map!=='function')throw Error('3D քարտեզի գրադարանը չբեռնվեց');const map=new maplibregl.Map({container:'map',center:[45.69,39.77],zoom:11,pitch:65,bearing:-25,maxPitch:85,antialias:true,style:{version:8,sources:{satellite:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery © Esri, Maxar, Earthstar Geographics and GIS User Community'},terrain:{type:'raster-dem',tiles:['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:15,encoding:'terrarium',attribution:'Terrain elevation: Mapzen / AWS Terrain Tiles'}} ,layers:[{id:'satellite',type:'raster',source:'satellite'}],terrain:{source:'terrain',exaggeration:1.25}}});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');map.on('load',()=>{const points=[{lat:39.723647,lng:45.718601,name:'Բացահանքի նախագծային կենտրոն'},{lat:39.764024,lng:45.654032,name:'Կույտային տարրալվացման հարթակ'},{lat:39.760966,lng:45.700141,name:'Հանքաքարի ջարդման արտադրամաս'},{lat:39.769713,lng:45.713586,name:'Դատարկ ապարների պահեստ'}];for(const p of points){const el=document.createElement('div');el.style.cssText='width:12px;height:12px;border:2px solid white;border-radius:50%;background:#8b4436;box-shadow:0 1px 6px #0008;cursor:pointer';new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).setPopup(new maplibregl.Popup().setText(p.name+' · 2013 թ. նախագծային կոորդինատ')).addTo(map)}document.getElementById('status').textContent='3D ռելիեֆ · պտտել, թեքել, մոտեցնել · 2013 թ. նախագծային կետեր'});map.on('error',e=>{if(e.error&&/terrain|DEM/i.test(e.error.message||''))document.getElementById('status').textContent='Ռելիեֆի տվյալները ժամանակավորապես անհասանելի են'});}catch(e){error.style.display='block';error.textContent=e.message||'3D քարտեզը չբացվեց';}</script></body></html>
